# Crowdin config for 3m-ui panel UI strings.
# Secrets: CROWDIN_PROJECT_ID, CROWDIN_PERSONAL_TOKEN
# Generate JSON: node scripts/i18n/ts-to-json.mjs
# Apply download: node scripts/i18n/json-to-ts.mjs
#
# File names match Crowdin language codes (zh-CN, pt-BR, …).
# Do not add identity languages_mapping — Crowdin rejects invalid mapping entries.

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: .
base_url: https://api.crowdin.com

preserve_hierarchy: true

files:
  - source: /frontend/src/i18n/crowdin/en.json
    translation: /frontend/src/i18n/crowdin/%locale%.json
    # Path of the source file inside the Crowdin project
    dest: /panel/en.json
    type: json
    # Only map when Crowdin's code differs from our filename.
    # Official codes: https://developer.crowdin.com/language-codes/
    # Our targets already use Crowdin codes (zh-CN, zh-TW, pt-BR, ja, …) — no mapping needed.
