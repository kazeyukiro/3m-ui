# 3M-UI configuration file.
# This file contains PLACEHOLDER secrets that will be REJECTED on startup.
# A missing configuration is generated by the application on first startup.
# This example is for explicit custom configuration only. Run `3m-ui init`, OR
# manually replace with random 32+ byte strings before first run.
# Generate with: openssl rand -hex 32

server:
  port: 8080
  mode: "debug"

database:
  path: "backend/data/3m-ui.db"

jwt:
  secret: "CHANGE_ME_TO_RANDOM_32_PLUS_BYTES"  # rejected by Validate; use install.sh or set random hex
security:
  # Empty → no cross-origin browser access. Use ["*"] only when you
  # intentionally want to allow every origin.
  # Example: ["https://panel.example.com"]
  cors_origins: []
  credential_key: "CHANGE_ME_TO_RANDOM_32_PLUS_BYTES"  # rejected by Validate; use install.sh or set random hex

mihomo:
  binary: "/usr/local/lib/3m-ui/mihomo"
  config: "backend/data/mihomo/config.yaml"
