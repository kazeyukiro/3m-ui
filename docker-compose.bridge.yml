# Standalone alternative: docker compose -f docker-compose.bridge.yml up -d
# The panel is reachable locally at http://127.0.0.1:8080. Use a TLS reverse proxy
# for remote access, or change the panel mapping to your intended host address.
# Add a TCP and UDP mapping for every listener (or a planned port range).
services:
  3m-ui:
    image: ${THREE_M_UI_IMAGE:-ghcr.io/kazeyukiro/3m-ui:latest}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      # - "10000-10100:10000-10100/tcp"
      # - "10000-10100:10000-10100/udp"
    environment:
      THREE_M_UI_CONFIG: /etc/3m-ui/config.yaml
      TZ: ${TZ:-UTC}
    volumes:
      - 3m-ui-config:/etc/3m-ui
      - 3m-ui-data:/var/lib/3m-ui
      - 3m-ui-logs:/var/log/3m-ui
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  3m-ui-config:
  3m-ui-data:
  3m-ui-logs:
