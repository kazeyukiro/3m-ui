name: Release · shadcn
on:
  # Tag pushes are handled by release.yml (all editions in one Release).
  # Use this workflow only to rebuild a single edition manually.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0-shadcn)
        required: true
        type: string
permissions: {contents: write}
jobs:
  build:
    strategy:
      matrix:
        include:
          - goarch: amd64
            artifact: linux-amd64
          - goarch: arm64
            artifact: linux-arm64
          - goarch: arm
            goarm: '7'
            artifact: linux-armv7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x'}
      - name: Build shadcn-style frontend
        working-directory: frontend-variants/shadcn
        run: npm install && npm run build
      - name: Embed shadcn-style frontend
        run: rm -rf backend/cmd/server/web/dist && cp -r frontend-variants/shadcn/dist backend/cmd/server/web/dist
      - name: Build backend
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath -ldflags='-s -w' -o ../3m-ui-${{ matrix.artifact }}-shadcn ./cmd/server
      - run: tar -czf 3m-ui-${{ matrix.artifact }}-shadcn.tar.gz 3m-ui-${{ matrix.artifact }}-shadcn
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.artifact }}-shadcn
          path: 3m-ui-${{ matrix.artifact }}-shadcn.tar.gz
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: artifacts}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*.tar.gz
