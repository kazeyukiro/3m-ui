name: Release · Ant Design
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - goarch: amd64
            artifact: linux-amd64
          - goarch: arm64
            artifact: linux-arm64
          - goarch: arm
            goarm: '7'
            artifact: linux-armv7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Build Ant Design frontend
        working-directory: frontend
        run: npm install && npm run build
      - name: Embed selected frontend
        run: rm -rf backend/cmd/server/web/dist && cp -r frontend/dist backend/cmd/server/web/dist
      - name: Build backend
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath -ldflags='-s -w' -o ../3m-ui-${{ matrix.artifact }} ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: 3m-ui-${{ matrix.artifact }}-antd
          path: 3m-ui-${{ matrix.artifact }}
      - name: Create archive
        run: tar -czf 3m-ui-${{ matrix.artifact }}-antd.tar.gz 3m-ui-${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.artifact }}-antd
          path: 3m-ui-${{ matrix.artifact }}-antd.tar.gz
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: artifacts/**/*.tar.gz
