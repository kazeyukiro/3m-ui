name: Release · Ant Design
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0). Required for manual runs on a branch.
        required: false
        type: string
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            artifact: linux-amd64
          - goarch: arm64
            artifact: linux-arm64
          - goarch: arm
            goarm: '7'
            artifact: linux-armv7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Build Ant Design frontend
        working-directory: frontend
        run: npm install && npm run build
      - name: Embed frontend
        run: |
          rm -rf backend/cmd/server/web/dist
          cp -r frontend/dist backend/cmd/server/web/dist
      - name: Build backend
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath -ldflags='-s -w' -o "../3m-ui-${{ matrix.artifact }}" ./cmd/server
      - name: Archive
        run: tar -czf "3m-ui-${{ matrix.artifact }}.tar.gz" "3m-ui-${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.artifact }}
          path: 3m-ui-${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Resolve tag
        id: meta
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag is required for workflow_dispatch on a branch" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Packages

            Official frontend: Ant Design.

            Architectures: `amd64`, `arm64`, `armv7`.
          files: artifacts/*.tar.gz
