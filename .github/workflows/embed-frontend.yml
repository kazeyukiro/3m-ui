name: Validate · Ant Design frontend
on:
  pull_request:
    paths:
      - 'frontend/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Build Ant Design frontend
        working-directory: frontend
        run: npm install && npm run build
